[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "vn-av-generation"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "opencv-python>=4.8", "av>=12", "scipy>=1.11,<2", "imageio-ffmpeg==0.6.0", "PyYAML>=6", "fastapi>=0.115", "uvicorn>=0.30"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]
[project.scripts]
vn-av-generate = "vn_av_generation.cli:entrypoint"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
