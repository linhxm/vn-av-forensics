pipeline: relations
seed: 42
device: cuda
dataset: datasets/relations_two_head_v1
dataset_manifest: manifest-reviewed.jsonl
manifest: datasets/manifests/two-head-v1.jsonl
cache: cache/fate-two-head-v1
output: runs/fate-two-head-v1
checkpoint: runs/fate-two-head-v1/best.pt
encoder:
  repo: external/FATE
  base: checkpoints/pe-av-small
  adapter: checkpoints/fate
  face_model: checkpoints/media/yunet.onnx
  device: cuda
  precision: float16
  window_s: 2.0
  step_s: 0.2
  temporal_bins: 8
  min_coverage: 0.75
  max_duration: 60
  max_side: 640
model:
  projection: 128
  hidden: 128
  radius: 4
  context: 3
  dropout: 0.1
  lag_confidence: 0.5
training:
  required_heads: [timing, lip_audio_mismatch]
  quality:
    max_false_alarm_rate: 0.05
    min_precision: 0.5
    min_recall: 0.1
    min_auroc: 0.6
    min_windows_per_class: 20
  timing_warmup_epochs: 3
  loss_weights: {timing: 1.0, lip_audio_mismatch: 1.0}
  epochs: 23
  lr: 0.0003
  weight_decay: 0.0001
  accumulation: 8
  patience: 5
  torch_threads: 2
jobs_dir: outputs/relation-jobs
host: 127.0.0.1
port: 8000
frontend_dist: demo/dist
