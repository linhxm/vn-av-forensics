pipeline: relations
seed: 42
device: cuda
dataset: datasets/dataset_v001
clean_manifest: datasets/manifests/v001-clean.jsonl
manifest: datasets/manifests/v001-controls.jsonl
cache: cache/fate-v001
output: runs/fate-v001
checkpoint: runs/fate-v001/best.pt
encoder:
  repo: external/FATE
  base: checkpoints/pe-av-small
  adapter: checkpoints/fate
  face_model: checkpoints/media/yunet.onnx
  device: cuda
  precision: float16
  window_s: 2.0
  step_s: 0.2
  temporal_bins: 8
  min_coverage: 0.75
  max_duration: 60
  max_side: 640
model:
  projection: 128
  hidden: 128
  radius: 4
  context: 3
  dropout: 0.1
  lag_confidence: 0.5
training:
  epochs: 20
  lr: 0.0003
  weight_decay: 0.0001
  accumulation: 8
  patience: 5
  torch_threads: 2
jobs_dir: outputs/relation-jobs
host: 127.0.0.1
port: 8000
frontend_dist: demo/dist
