[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-av-training"
version = "3.0.0"
description = "Vietnamese audio-visual deepfake data, training, evaluation and demo pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3", "torch>=2.2", "opencv-python>=4.8",
  "scipy>=1.11,<2", 
  "imageio-ffmpeg==0.6.0", "av>=12", "PyYAML>=6",
  "scikit-learn>=1.4", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.12"
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]

[project.scripts]
vn-av-train = "vn_av_training.cli:entrypoint"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["assets: requires manually downloaded pretrained assets"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vn_av_training*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
