[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-av-forensics"
version = "0.2.0"
description = "Local audio-mouth temporal inconsistency detection"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "torch>=2.2", "opencv-python>=4.8",
  "scipy>=1.11,<2", "python_speech_features==0.6",
  "imageio-ffmpeg==0.6.0", "scenedetect==0.6.7.1",
  "tqdm>=4.66", "matplotlib>=3.8", "pandas>=2",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.12"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["avtc*"]

[tool.ruff]
line-length = 100
target-version = "py310"
